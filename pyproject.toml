[project]
name = "agentic-tui"
version = "0.3.0"
description = "A TUI primitive for coding agents — streaming markdown, tool calls, diffs, and more in linear scrollback with zero flicker."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Arvind" },
]
keywords = ["tui", "terminal", "agent", "cli", "llm", "coding-agent", "rich", "prompt-toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
gitignore = ["pathspec>=0.11"]

[project.urls]
Homepage = "https://github.com/dnivra26/agentic-tui"
Repository = "https://github.com/dnivra26/agentic-tui"
Issues = "https://github.com/dnivra26/agentic-tui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tui"]

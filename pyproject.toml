[project]
name = "agentui"
version = "0.3.0"
description = "A TUI primitive for coding agents"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
gitignore = ["pathspec>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentui"]
